<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token 管理</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(20, 28, 52, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef2ff;
      --muted: #98a2c7;
      --primary: #6d8cff;
      --primary-2: #9d6dff;
      --danger: #ff6b81;
      --ok: #42d392;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(109, 140, 255, 0.25), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(157, 109, 255, 0.22), transparent 35%),
        var(--bg);
    }

    .card {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .desc {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: rgba(0, 0, 0, 0.22);
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(109, 140, 255, 0.18);
    }

    input::placeholder {
      color: #6f789b;
    }

    button {
      height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      transition: transform 0.15s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-ghost {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .actions button {
      flex: 1;
      min-width: 120px;
    }

    .danger {
      color: var(--danger);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6f789b;
      flex: none;
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 10px rgba(66, 211, 146, 0.7);
    }

    .dot.err {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 107, 129, 0.6);
    }

    .link-row {
      margin-top: 18px;
    }

    .link-row a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
      font-size: 14px;
      transition: border-color 0.2s, background 0.2s;
    }

    .link-row a:hover {
      border-color: var(--primary);
      background: rgba(109, 140, 255, 0.14);
    }

    .note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Token 管理</h1>
    <p class="desc">仅保留 Token 的本地保存与管理，不包含任务、抽奖或其他功能。</p>

    <label for="tokenInput">Token</label>
    <div class="input-wrap">
      <input
        id="tokenInput"
        type="password"
        placeholder="请输入 Token"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="toggleBtn" class="btn-ghost" type="button">显示</button>
    </div>

    <div class="actions">
      <button id="saveBtn" type="button">保存 Token</button>
      <button id="copyBtn" class="btn-ghost" type="button">复制</button>
      <button id="clearBtn" class="btn-ghost danger" type="button">清空</button>
    </div>

    <div class="status" aria-live="polite">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">等待操作</span>
    </div>

    <div class="link-row">
      <a href="https://delicater.github.io/pwa_av9/index.html" target="_blank" rel="noopener noreferrer">
        打开 index.html →
      </a>
    </div>

    <div class="note">
      Token 仅保存在当前浏览器的 localStorage 中，不会上传到任何服务器。
      在公共设备上使用后请及时清空。
    </div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "token";

      const tokenInput = document.getElementById("tokenInput");
      const saveBtn = document.getElementById("saveBtn");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");
      const toggleBtn = document.getElementById("toggleBtn");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");

      function setStatus(text, type = "") {
        statusText.textContent = text;
        statusDot.className = "dot" + (type ? " " + type : "");
      }

      function loadToken() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          tokenInput.value = saved;
          setStatus("已从本地加载 Token", "ok");
        } else {
          setStatus("本地暂无 Token", "");
        }
      }

      function saveToken() {
        const token = tokenInput.value.trim();
        if (!token) {
          setStatus("Token 不能为空", "err");
          tokenInput.focus();
          return;
        }

        localStorage.setItem(STORAGE_KEY, token);
        setStatus("Token 已保存到本地", "ok");
      }

      async function copyToken() {
        const token = tokenInput.value.trim();
        if (!token) {
          setStatus("没有可复制的 Token", "err");
          return;
        }

        try {
          await navigator.clipboard.writeText(token);
          setStatus("Token 已复制到剪贴板", "ok");
        } catch {
          tokenInput.type = "text";
          tokenInput.select();
          const ok = document.execCommand("copy");
          tokenInput.type = "password";
          setStatus(ok ? "Token 已复制到剪贴板" : "复制失败，请手动复制", ok ? "ok" : "err");
        }
      }

      function clearToken() {
        localStorage.removeItem(STORAGE_KEY);
        tokenInput.value = "";
        tokenInput.type = "password";
        toggleBtn.textContent = "显示";
        setStatus("Token 已清空", "ok");
        tokenInput.focus();
      }

      function toggleVisible() {
        const isPassword = tokenInput.type === "password";
        tokenInput.type = isPassword ? "text" : "password";
        toggleBtn.textContent = isPassword ? "隐藏" : "显示";
      }

      saveBtn.addEventListener("click", saveToken);
      copyBtn.addEventListener("click", copyToken);
      clearBtn.addEventListener("click", clearToken);
      toggleBtn.addEventListener("click", toggleVisible);

      tokenInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          saveToken();
        }
      });

      loadToken();
    })();
  </script>
</body>
</html>
